plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '1.0.0'
group = 'com.example.farmbuilder'
base { archivesName = 'farmbuilder' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Плоская структура: все .java лежат в корне репозитория
sourceSets {
    main {
        java {
            srcDir '.'
            include '*.java'
        }
    }
}

processResources {
    from('neoforge.mods.toml') { into 'META-INF' }
}

neoForge {
    version = '21.1.172'
    runs {
        client { client() }
    }
    mods {
        farmbuilder { sourceSet sourceSets.main }
    }
}
